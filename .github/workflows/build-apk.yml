name: Build Forknook APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/app/**'
      - 'android/build.gradle'
      - 'android/settings.gradle'
      - 'android/gradle.properties'
      - 'android/gradle/wrapper/gradle-wrapper.properties'
      - 'android/app/src/main/res/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Use Android project directory
        run: echo "GRADLE_ROOT=$GITHUB_WORKSPACE/android" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use hosted Android SDK and install platform
        run: |
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Generate official Gradle wrapper
        working-directory: android
        run: gradle --no-daemon wrapper --gradle-version 8.11.1
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Version APK filename from Android app config
        run: |
          python - <<'PY'
          import pathlib, re, shutil
          config = pathlib.Path('android/app/build.gradle').read_text()
          version = re.search(r"versionName\s+'([^']+)'", config).group(1)
          shutil.copyfile('android/app/build/outputs/apk/debug/app-debug.apk', f'Forknook-v{version}-debug.apk')
          print('Created versioned APK:', version)
          PY
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Forknook-Android-debug
          path: Forknook-v*-debug.apk
          if-no-files-found: error
          retention-days: 30
