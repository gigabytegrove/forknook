plugins { id 'com.android.application' }

android {
    namespace 'dev.recipebridge.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.recipebridge.mobile'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '2.1.1'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
